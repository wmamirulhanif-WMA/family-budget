<!doctype html><html lang=en><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=theme-color content="#0f766e"><link rel=manifest href=manifest.json><link rel=icon href=icon-192.png><title>Family Budget</title>
<style>
:root{--g:#0f766e;--b:#f3f4f6;--c:#fff;--t:#111;--m:#6b7280;--r:#dc2626}
@media(prefers-color-scheme:dark){:root{--b:#111827;--c:#1f2937;--t:#f3f4f6;--m:#9ca3af}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--b);color:var(--t);padding-bottom:72px}
main{padding:12px;max-width:640px;margin:auto}.card{background:var(--c);border-radius:12px;padding:12px;margin:0 0 12px}
input,select,button{font:inherit;width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #9ca3af66;background:var(--c);color:var(--t)}
button{background:var(--g);color:#fff;border:0}button.s{background:#9ca3af33;color:var(--t)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);border-top:1px solid #9ca3af44}nav button{background:0;color:var(--m);border-radius:0;margin:0;font-size:12px}nav .on{color:var(--g);font-weight:700}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row>*{width:auto;flex:1}.row>.f{flex:0 0 auto}
.bar{height:8px;background:#9ca3af33;border-radius:4px}.bar i{display:block;height:100%;background:var(--g);border-radius:4px}
.m{color:var(--m);font-size:13px}.neg{color:var(--r)}h3{margin:2px 0 8px}.big{font-size:20px;font-weight:700}
.a{min-width:90px;text-align:right}
html,body{overflow-x:hidden}.row>*{min-width:0}select,input{min-width:0;max-width:100%}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2>*{min-width:0;width:100%}.ic{padding:6px 10px;font-size:17px}button:disabled{opacity:.4}
</style></head><body><main id=app></main><nav id=nav></nav>
<script>
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),
fmt=n=>(+n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),
list=k=>Object.values(S.items).filter(i=>i.k==k&&!i.del),cfg=()=>S.items.cfg||{names:['Husband','Wife']},nm=()=>cfg().names,
n_=id=>(S.items[id]||{}).n||'',TN={exp:'Expense',inc:'Income',xfer:'Transfer'};
let hw=null,hc='',D=null,RM=0;let S={items:{},url:''},U={},tab='dash',rng='cur',from='',to_='',edit=null,ty='exp',R='';
const db=new Promise(r=>{const q=indexedDB.open('fb',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const save=()=>db.then(d=>d.transaction('k','readwrite').objectStore('k').put(S,'s'));
async function sync(){if(!S.url)return;try{const r=await(await fetch(S.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:S.key,items:S.items})})).json();
if(r.err)return alert('Sync failed: wrong secret key');const b4=JSON.stringify(S.items);for(const id in r)if(!S.items[id]||r[id].upd>=S.items[id].upd)S.items[id]=r[id];if(JSON.stringify(S.items)!=b4){await save();if(tab!='add'&&!/INPUT|SELECT/.test(document.activeElement.tagName))render()}}catch(e){}}
function put(o){o.upd=Date.now();S.items[o.id]=o;save();sync();render()}
function rg(){const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=x=>x.toISOString().slice(0,10),L=(a,b)=>[d(new Date(Date.UTC(a,b,1))),d(new Date(Date.UTC(a,b+1,0)))];
return rng=='cur'?L(y,m):rng=='last'?L(y,m-1):[from||'0000',to_||'9999']}
function calc(){const[a,b]=rg(),T=list('tx').filter(t=>t.date>=a&&t.date<=b).sort((p,q)=>p.date<q.date?1:-1),
s=f=>T.filter(f).reduce((z,t)=>z+t.amt,0),bc={},bp={};
T.filter(t=>t.t=='exp').forEach(t=>{bc[t.cat]=(bc[t.cat]||0)+t.amt;bp[t.who]=(bp[t.who]||0)+t.amt});
return{a,b,T,inc:s(t=>t.t=='inc'),exp:s(t=>t.t=='exp'),fee:T.reduce((z,t)=>z+(t.fee||0),0),bc,bp}}
const bal=x=>list('tx').reduce((z,t)=>z+(t.t=='inc'&&t.acc==x.id?t.amt:t.t=='exp'&&t.acc==x.id?-t.amt:t.t=='xfer'?(t.acc==x.id?-t.amt-(t.fee||0):0)+(t.to==x.id?t.amt:0):0),x.x||0);
let bm=new Date().toISOString().slice(0,7),ht='',ha='',hf='',hu='',hp=0;
const lc=k=>list(k).sort((a,b)=>(a.ord||0)-(b.ord||0)||(a.id<b.id?-1:1));
function mv(k,id,d){const L=lc(k),i=L.findIndex(x=>x.id==id),j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];L.forEach((x,n)=>{if(x.ord!=n+1){x.ord=n+1;x.upd=Date.now()}});save();sync();render()}
function dl(id){const o=S.items[id],n=list('tx').filter(t=>o.k=='acc'?(t.acc==id||t.to==id):t.cat==id).length;if(n)return alert(`Cannot delete "${o.n}": it has ${n} record(s).`);if(confirm('Delete '+o.n+'?'))put({...o,del:true})}

const nxt=m=>{const[y,n]=m.split('-');return new Date(Date.UTC(+y,+n,1)).toISOString().slice(0,7)};
function bud(id,m){let b=null;list('bud').forEach(r=>{if(r.c==id&&r.m<=m&&(!b||r.m>b.m))b=r});return b?b.x:((S.items[id]||{}).x||0)}
function mrange(a,b){const f=a=='0000'?(list('tx').map(t=>t.date).sort()[0]||new Date().toISOString().slice(0,10)):a,e=b=='9999'?new Date().toISOString().slice(0,7):b.slice(0,7);let m=f.slice(0,7);const r=[];while(m<=e&&r.length<120){r.push(m);m=nxt(m)}return r}
const rb=(id,a,b)=>mrange(a,b).reduce((z,m)=>z+bud(id,m),0);
function sb(id){const m=bm,c=S.items[id],old=bud(id,m),v=prompt(`Budget for ${c.n} in ${m}`,old);if(v===null||v==='')return;const x=+v||0,all=confirm('Also use this amount for the following months?\nOK = yes (until you change it again)\nCancel = this month only'),nx=nxt(m);
put({id:'b_'+id+'_'+m,k:'bud',c:id,m,x});if(!all&&!list('bud').some(r=>r.c==id&&r.m==nx))put({id:'b_'+id+'_'+nx,k:'bud',c:id,m:nx,x:old})}
const PC=['#0f766e','#f59e0b'];
function pie(d,em){const t=d.reduce((z,x)=>z+x[1],0);if(!t)return `<div class=m>${em}</div>`;let a=-Math.PI/2,s='';const P=an=>[(60+55*Math.cos(an)).toFixed(2),(60+55*Math.sin(an)).toFixed(2)];
d.forEach(([n,v],i)=>{const f=v/t,e=a+f*2*Math.PI;if(f>=.9999)s+=`<circle cx=60 cy=60 r=55 fill="${PC[i]}"/>`;else if(f>0){const[x1,y1]=P(a),[x2,y2]=P(e);s+=`<path d="M60 60L${x1} ${y1}A55 55 0 ${f>.5?1:0} 1 ${x2} ${y2}Z" fill="${PC[i]}"/>`}a=e});
return `<svg viewBox="0 0 120 120" style="width:100%;max-width:120px;display:block;margin:0 auto 8px">${s}</svg>${d.map(([n,v],i)=>`<div style="margin-bottom:4px"><span style="color:${PC[i]}">●</span> ${n}<br><b>${fmt(v)}</b> <span class=m>${(v/t*100).toFixed(1)}%</span></div>`).join('')}`}
const hb=(l,v,mx,col)=>`<div class=row style="margin:6px 0"><span class=m style="flex:0 0 78px">${l}</span><div class=bar style="flex:1"><i style="width:${mx?Math.min(100,Math.max(v,0)/mx*100):0}%;background:${col}"></i></div><span style="flex:0 0 92px;text-align:right">${fmt(v)}</span></div>`;
function bg(tb,ex){if(!tb)return '<div class=m>No budget set for this period</div>';const over=ex>tb,sp=Math.min(100,ex/tb*100),left=Math.max(tb-ex,0),cs=over?'#dc2626':'#f59e0b',seg=(w,c,t)=>`<div style="width:${w}%;background:${c};color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center">${w>=12?t:''}</div>`;
return `<div class=m>Total budget</div><div class=big>${fmt(tb)}</div><div style="display:flex;height:30px;border-radius:8px;overflow:hidden;margin:8px 0;background:#9ca3af33">${seg(sp,cs,(ex/tb*100).toFixed(0)+'%')}${seg(100-sp,'#0f766e',(left/tb*100).toFixed(0)+'%')}</div><div class=row style="align-items:flex-start"><div><span style="color:${cs}">●</span> Expenses<br><b>${fmt(ex)}</b> <span class=m>${(ex/tb*100).toFixed(1)}%</span></div><div style="text-align:right"><span style="color:#0f766e">●</span> Balance<br><b class="${over?'neg':''}">${over?'-'+fmt(ex-tb):fmt(left)}</b> <span class=m>${over?'over budget':(left/tb*100).toFixed(1)+'%'}</span></div></div>`}
function grp(o,L){const lock=!(!o||o=='Joint'||o==S.me||U[o]),tot=L.reduce((z,x)=>z+bal(x),0);
return `<div class=row style="margin-top:10px;border-bottom:1px solid #9ca3af44;padding-bottom:4px"><b>${o||'No owner'}</b>${lock?`<b class=f onclick="ul(${nm().indexOf(o)})">XXXXX 🔒</b>`:`<b class="f ${tot<0?'neg':''}">${fmt(tot)}</b>`}</div>`+L.map(x=>`<div class=row><span class=m>${x.n}</span>${lock?'<span class="f m">XXXXX</span>':`<span class="f ${bal(x)<0?'neg':''}">${fmt(bal(x))}</span>`}</div>`).join('')}
function dash(){const c=calc(),bar=(v,mx)=>`<div class=bar><i style="width:${Math.min(100,mx?v/mx*100:0)}%;${v>mx&&mx?'background:var(--r)':''}"></i></div>`,vis=x=>!x.o||x.o=='Joint'||x.o==S.me||U[x.o],K=lc('cat'),pp=n=>c.T.reduce((z,t)=>z+(t.who==n?(t.t=='exp'?t.amt:0)+(t.fee||0):0),0),
B=Object.fromEntries(K.map(k=>[k.id,rb(k.id,c.a,c.b)])),tp=c.T.filter(t=>t.t=='xfer').reduce((z,t)=>(z[t.who]=(z[t.who]||0)+t.amt,z),{}),tb=K.reduce((z,k)=>z+B[k.id],0),ts=K.reduce((z,k)=>z+(B[k.id]?c.bc[k.id]||0:0),0);
return `<div class=card><div class=m>👤 ${S.me}</div><select onchange="rng=this.value;render()">${[['cur','This month'],['last','Last month'],['custom','Custom range']].map(([k,l])=>`<option value=${k} ${rng==k?'selected':''}>${l}</option>`).join('')}</select>
${rng=='custom'?`<div class=row><input type=date value="${from}" onchange="from=this.value;render()"><input type=date value="${to_}" onchange="to_=this.value;render()"></div>`:`<div class=m>${c.a} → ${c.b}</div>`}</div>
<div class=card><div class=row style="align-items:flex-start;gap:12px"><div><h3>Expenses by person</h3>${pie(nm().map(n=>[n,c.bp[n]||0]),'No expenses')}</div><div><h3>Transfers by person</h3>${pie(nm().map(n=>[n,tp[n]||0]),'No transfers')}</div></div></div>
<div class=card><h3>Budget vs expenses</h3>${bg(tb,c.exp+c.fee)}</div>
<div class=card><h3>Budget by category</h3>${K.map(k=>{const s=c.bc[k.id]||0,x=B[k.id];return `<div class=row><span>${k.n}</span><span class="f ${x&&x-s<0?'neg':''}">${x?'left '+fmt(x-s):fmt(s)+' spent'}</span></div>${x?`<div class=m>${fmt(s)} / ${fmt(x)}</div>`+bar(s,x):''}`}).join('')||'<div class=m>Add categories in Settings</div>'}</div>
<div class=card><h3>Account balances</h3>${(A=>{const g=[...nm(),'Joint',''].map(o=>[o,A.filter(x=>(x.o||'')==o)]).filter(x=>x[1].length);return g.length?g.map(x=>grp(x[0],x[1])).join(''):'<div class=m>Add accounts in Settings</div>'})(list('acc'))}</div>`}
const ao=(L,v)=>L.map(x=>`<option value=${x.id} ${x.id==v?'selected':''}>${x.n}${x.o?' · '+x.o:''}</option>`).join('');
function uto(){const f=$('#acc').value,t=$('#to');if(t)t.innerHTML=ao(list('acc').filter(x=>x.id!=f),t.value)}
function add(){const e=edit&&S.items[edit]||D||{},rc=R||(RM?'':e.rcpt||''),o=ao,AL=list('acc').filter(x=>!x.o||x.o=='Joint'||x.o==S.me||x.id==e.acc),fv=AL.some(x=>x.id==(e.acc||S.la))?(e.acc||S.la):(AL[0]||{}).id;
return `<div class=card><div class=row>${Object.entries(TN).map(([k,l])=>`<button class="${ty==k?'':'s'}" onclick="ty='${k}';render()">${l}</button>`).join('')}</div>
<input id=amt type=number step=0.01 inputmode=decimal placeholder=Amount value="${e.amt||''}"><input id=date type=date value="${e.date||new Date().toISOString().slice(0,10)}">
${ty=='exp'?`<select id=cat>${o(lc('cat'),e.cat)}</select>`:''}${ty=='inc'&&lc('icat').length?`<select id=cat><option value="">Income category (optional)</option>${o(lc('icat'),e.cat)}</select>`:''}
${ty=='xfer'?`<div class=m>From account</div>`:''}<select id=acc ${ty=='xfer'?'onchange=uto()':''}>${o(AL,fv)}</select>
${ty=='xfer'?`<div class=m>To account</div><select id=to>${o(list('acc').filter(x=>x.id!=fv),e.to)}</select><input id=fee type=number step=0.01 inputmode=decimal placeholder="Bank charge (optional)" value="${e.fee||''}">`:''}
<input id=note placeholder=Notes value="${e.note||''}">
${ty=='exp'?`<div class=row><button class=s onclick="$('#cam').click()">📷 Take photo</button><button class=s onclick="$('#gal').click()">🖼 Choose file</button></div><input id=cam type=file accept="image/*" capture=environment hidden onchange="rcp(this,1)"><input id=gal type=file accept="image/*" hidden onchange="rcp(this,0)"><span class=m id=rs>${rc?'Receipt attached (take/choose to replace)':'Receipt (optional)'}</span><div class=row id=rb style="display:${rc?'flex':'none'}"><button class=s onclick=pvw()>👁 View / hide</button><button class=s onclick=rmr()>🗑 Remove</button></div><img id=pv hidden style="width:100%">`:''}
<button onclick=sv()>${edit?'Update':'Save'}</button>${edit?'<button class=s onclick="edit=null;render()">Cancel</button>':''}</div>`}
function rcp(i,st){if(i.files[0])rf(i.files[0],st)}
function rf(f,st,cb){const im=new Image;im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas'),w=c.width=im.width*k,h=c.height=im.height*k,x=c.getContext('2d');x.drawImage(im,0,0,w,h);
if(st){const t=new Date().toLocaleString(),fs=Math.max(14,w/28);x.font=fs+'px sans-serif';const tw=x.measureText(t).width;x.fillStyle='rgba(0,0,0,.6)';x.fillRect(w-tw-fs,h-fs*1.8,tw+fs,fs*1.8);x.fillStyle='#ffd400';x.fillText(t,w-tw-fs/2,h-fs*.55)}
R=c.toDataURL('image/jpeg',.6);const z=$('#rs');if(z){z.textContent='Photo ready ✓';$('#rb').style.display='flex'}if(cb)cb()};im.onerror=()=>alert('Could not read that image file');im.src=URL.createObjectURL(f)}
function pvw(){const i=$('#pv');if(i.hidden){i.src=R||(S.items[edit]||{}).rcpt||'';i.hidden=false}else i.hidden=true}
function rmr(){R='';RM=1;$('#rb').style.display='none';$('#pv').hidden=true;$('#rs').textContent='Receipt removed (applies when you save)'}
function sv(){const v=i=>($('#'+i)||{}).value,amt=+v('amt');if(!amt||!v('acc'))return alert('Enter an amount, and add an account in Settings first');if(ty=='exp'&&!v('cat'))return alert('Add a category in Settings first');
if(ty=='xfer'&&(!v('to')||v('acc')==v('to')))return alert('Choose a different To account');const old=edit&&S.items[edit]||{};S.la=v('acc');put({...old,id:edit||uid(),k:'tx',t:ty,amt,date:v('date'),who:old.who||S.me,cat:v('cat')||'',acc:v('acc'),to:v('to')||'',fee:+v('fee')||0,note:v('note'),rcpt:R||(RM?'':old.rcpt||'')});edit=null;D=null;R='';RM=0;tab='hist';render()}
function tg(id){const i=$('#r_'+id);if(i.hidden){i.src=S.items[id].rcpt;i.hidden=false}else i.hidden=true}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hist(){const w=hw==null?S.me:hw,PS=20,T=list('tx').filter(t=>(w=='*'||t.who==w)&&(!hc||t.cat==hc)&&(!ht||t.t==ht)&&(!ha||t.acc==ha||t.to==ha)&&(!hf||t.date>=hf)&&(!hu||t.date<=hu)).sort((p,q)=>p.date<q.date?1:p.date>q.date?-1:(q.upd||0)-(p.upd||0)),
np=Math.max(1,Math.ceil(T.length/PS)),pg=Math.min(hp,np-1),sm=t=>T.filter(x=>x.t==t).reduce((z,x)=>z+x.amt,0),oc=(L,v)=>L.map(k=>`<option value=${k.id} ${v==k.id?'selected':''}>${k.n}</option>`).join('');
return `<div class=card><div class=g2>
<select onchange="hw=this.value;hp=0;render()"><option value="*" ${w=='*'?'selected':''}>All people</option>${nm().map(n=>`<option ${w==n?'selected':''}>${n}</option>`).join('')}</select>
<select onchange="ht=this.value;hp=0;render()"><option value="">All types</option>${Object.entries(TN).map(([k,l])=>`<option value=${k} ${ht==k?'selected':''}>${l}</option>`).join('')}</select>
<select onchange="hc=this.value;hp=0;render()"><option value="">All categories</option><optgroup label="Expense">${oc(lc('cat'),hc)}</optgroup><optgroup label="Income">${oc(lc('icat'),hc)}</optgroup></select>
<select onchange="ha=this.value;hp=0;render()"><option value="">All accounts</option>${oc(list('acc'),ha)}</select>
<div><div class=m>From date</div><input type=date value="${hf}" onchange="hf=this.value;hp=0;render()"></div>
<div><div class=m>To date</div><input type=date value="${hu}" onchange="hu=this.value;hp=0;render()"></div></div>
<button class=s onclick="hw='*';hc=ht=ha=hf=hu='';hp=0;render()">Show all / clear filters</button></div>
<div class=m style="margin:0 0 8px">${T.length} entries · Expenses ${fmt(sm('exp'))} · Income ${fmt(sm('inc'))} · Transfers ${fmt(sm('xfer'))}</div>`
+(T.slice(pg*PS,pg*PS+PS).map(t=>`<div class=card><div class=row onclick="edit='${t.id}';ty='${t.t}';tab='add';D=null;R='';RM=0;render()"><div><b>${t.t=='xfer'?'Transfer '+esc(n_(t.acc))+' → '+esc(n_(t.to)):esc(n_(t.cat)||TN[t.t])}</b><div class=m>${t.date} · ${esc(t.who||'')}${t.t=='xfer'?'':' · '+esc(n_(t.acc))}${t.fee?' · charge '+fmt(t.fee):''}</div>${t.note?`<div class=m style="white-space:pre-wrap">📝 ${esc(t.note)}</div>`:''}</div><b class="f ${t.t=='exp'?'neg':''}">${t.t=='exp'?'-':''}${fmt(t.amt)}</b></div>
<div class=row>${t.rcpt?`<span onclick="tg('${t.id}')">📎 Receipt (tap to show/hide)</span>`:'<span></span>'}<span class="f m" onclick="if(confirm('Delete?'))put({...S.items['${t.id}'],del:true})">✕ Delete</span></div>${t.rcpt?`<img id=r_${t.id} hidden style="width:100%;margin-top:8px" onclick="tg('${t.id}')">`:''}</div>`).join('')||'<div class=m>No transactions</div>')
+(np>1?`<div class=row><button class=s ${pg?'':'disabled'} onclick="hp=${pg-1};render();scrollTo(0,0)">◀ Prev</button><span class=m style="text-align:center">Page ${pg+1} / ${np}</span><button class=s ${pg<np-1?'':'disabled'} onclick="hp=${pg+1};render();scrollTo(0,0)">Next ▶</button></div>`:'')}
function pa(k,id,pre){const o=S.items[id]||{},n=prompt(k=='acc'?'Account name':k=='icat'?'Income category name':'Category name',o.n||'');if(!n)return;const x=((k=='cat'&&id)||k=='icat')?o.x:prompt(k=='acc'?'Opening balance':'Budget for the month shown in Settings and following months (0 = none)',o.x||0);let ow=o.o;
if(k=='acc'){const N=nm();if(!id&&pre!==undefined)ow=[N[0],N[1],'Joint'][pre];else{const r=prompt(`Owner: 1=${N[0]}, 2=${N[1]}, 3=Joint`,ow==N[0]?1:ow==N[1]?2:ow=='Joint'?3:'');ow=[N[0],N[1],'Joint'][r-1];if(!ow)return alert('Not saved: owner must be 1, 2 or 3')}}
const nid=id||uid(),od=(k=='cat'||k=='icat')&&!id?{ord:Math.max(0,...lc(k).map(x=>x.ord||0))+1}:{};put({...o,id:nid,k,n,x:k=='cat'&&!id?0:+x||0,o:ow,...od});if(k=='cat'&&!id&&+x)put({id:'b_'+nid+'_'+bm,k:'bud',c:nid,m:bm,x:+x})}
function pn(i){const L=[...nm()],n=prompt('Name',L[i]);if(!n)return;L[i]=n;put({...cfg(),id:'cfg',k:'cfg',names:L})}
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function spw(){const p=prompt('Choose a password to protect your account balances');if(!p)return;const c=cfg();put({...c,id:'cfg',k:'cfg',names:c.names,pw:{...(c.pw||{}),[S.me]:await sha(p)}});alert('Password saved')}
async function ul(i){const o=nm()[i],h=(cfg().pw||{})[o];if(!h)return alert(o+' has not set a password yet (Settings → Set my password)');const p=prompt('Password of '+o);if(!p)return;if(await sha(p)==h){U[o]=1;render()}else alert('Wrong password')}
function pick(){return `<div class=card><h3>Whose phone is this?</h3>${nm().map((n,i)=>`<button onclick="S.me=nm()[${i}];save();render()">${n}</button>`).join('')}</div>`}
function set(){const N=nm(),A=list('acc'),row=x=>`<div class=row><span onclick="pa('${x.k}','${x.id}')">${x.n}</span><span class="f a">${fmt(x.x)}</span><span class="f m" onclick="dl('${x.id}')">✕</span></div>`,
box=(t,L,ad)=>`<div class=card><h3>${t}</h3>${L.map(row).join('')}<button class=s onclick="${ad}">+ Add</button></div>`;
return `<div class=card><h3>This phone belongs to: ${S.me}</h3><button class=s onclick="S.me='';save();render()">Change</button><button onclick=spw()>Set my password (protects my account balances)</button></div>`
+[N[0],N[1],'Joint'].map((o,i)=>box(`Accounts – ${o} <span class=m>(opening balance)</span>`,A.filter(x=>x.o==o),`pa('acc','',${i})`)).join('')
+(A.some(x=>!x.o)?box('Accounts – no owner <span class=m>(tap to set)</span>',A.filter(x=>!x.o),"pa('acc')"):'')
+`<div class=card><h3>Categories & budgets</h3><div class=row><span class=m>Budget month</span><input type=month value="${bm}" onchange="bm=this.value||bm;render()"></div>${lc('cat').map(x=>`<div class=row><span onclick="pa('cat','${x.id}')">${x.n}</span><span class="f a" onclick="sb('${x.id}')">${fmt(bud(x.id,bm))}</span><span class="f ic" onclick="mv('cat','${x.id}',-1)">↑</span><span class="f ic" onclick="mv('cat','${x.id}',1)">↓</span><span class="f m ic" onclick="dl('${x.id}')">✕</span></div>`).join('')}<div class=m>Tap a name to rename, an amount to set the budget for ${bm} (earlier months unchanged). Use ↑ ↓ to reorder. Items with records cannot be deleted.</div><button class=s onclick="pa('cat')">+ Add</button></div>`
+`<div class=card><h3>Income categories</h3>${lc('icat').map(x=>`<div class=row><span onclick="pa('icat','${x.id}')">${x.n}</span><span class="f ic" onclick="mv('icat','${x.id}',-1)">↑</span><span class="f ic" onclick="mv('icat','${x.id}',1)">↓</span><span class="f m ic" onclick="dl('${x.id}')">✕</span></div>`).join('')}<button class=s onclick="pa('icat')">+ Add</button></div>`
+`<div class=card><h3>Export Excel (current dashboard range)</h3><button onclick=xl(1)>Raw transactions</button><button onclick=xl(0)>Summary (massaged)</button></div>
<div class=card><h3>People (rename before adding data)</h3>${N.map((n,i)=>`<button class=s onclick=pn(${i})>${n} (rename)</button>`).join('')}</div>
<div class=card><h3>Sync (Google Sheets)</h3><div class=m>Use the same Web app URL and secret key on both phones.</div><input id=url placeholder="https://script.google.com/macros/s/.../exec" value="${S.url}"><input id=key placeholder="Secret key" value="${S.key||''}"><button onclick="S.url=$('#url').value.trim();S.key=$('#key').value.trim();save();sync();alert('Saved. Syncing...')">Save & sync now</button></div>`}
const ld=()=>window.XLSX?0:new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=r;s.onerror=()=>{alert('Internet needed to load the export library');j()};document.head.appendChild(s)});
async function xl(raw){await ld();const c=calc(),W=XLSX.utils,wb=W.book_new(),add=(rows,n)=>W.book_append_sheet(wb,W.json_to_sheet(rows),n);
if(raw)add(c.T.slice().reverse().map(t=>({Date:t.date,Type:TN[t.t],By:t.who,Category:n_(t.cat),Account:n_(t.acc),'To account':n_(t.to),Amount:t.amt,'Bank charge':t.fee||0,Notes:t.note,Receipt:t.rcpt?'Yes':''})),'Transactions');
else{add([{Item:'Income',Amount:c.inc},{Item:'Expenses',Amount:c.exp},{Item:'Bank charges',Amount:c.fee},{Item:'Net',Amount:c.inc-c.exp-c.fee}],'Summary');
add(lc('cat').map(k=>({Category:k.n,Spent:c.bc[k.id]||0,Budget:rb(k.id,c.a,c.b),Remaining:rb(k.id,c.a,c.b)?rb(k.id,c.a,c.b)-(c.bc[k.id]||0):''})),'By Category');
add(nm().map(n=>({Person:n,Spent:c.bp[n]||0})),'By Person');add(list('acc').map(x=>({Account:x.n,Balance:bal(x)})),'Accounts')}
XLSX.writeFile(wb,`budget-${raw?'raw':'summary'}-${c.a}_${c.b}.xlsx`)}
function render(){$('#nav').innerHTML=[['dash','📊','Dashboard'],['add','➕','Add'],['hist','🧾','History'],['set','⚙️','Settings']].map(([k,i,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';if(tab!='add'){edit=null;D=null;R='';RM=0}render()">${i}<br>${l}</button>`).join('');$('#app').innerHTML=!S.me?pick():{dash,add,hist,set}[tab]()}
function chk(d){d.transaction('k').objectStore('k').get('share').onsuccess=e=>{const s=e.target.result;if(!s)return;d.transaction('k','readwrite').objectStore('k').delete('share');
const m=(s.text||'').match(/(?:RM|MYR)\s*([\d,]+(?:\.\d{1,2})?)/i)||(s.text||'').match(/(\d[\d,]*\.\d{2})/);
D={amt:m?m[1].replace(/,/g,''):'',acc:S.la};ty='exp';tab='add';R='';RM=0;render();
if(s.buf)rf(new Blob([s.buf],{type:s.type||'image/jpeg'}),0,render);else alert('No image reached the app (fields received: '+(s.keys||'none')+'). Try sharing the screenshot/image itself.')}}
(async()=>{const d=await db;d.transaction('k').objectStore('k').get('s').onsuccess=e=>{if(e.target.result)S=e.target.result;render();sync();chk(d)};render()})();
document.addEventListener('visibilitychange',()=>{if(document.hidden)U={};else{sync();if(tab!='add')render()}});setInterval(sync,30000);
if('serviceWorker'in navigator){const had=navigator.serviceWorker.controller;navigator.serviceWorker.register('sw.js');navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had)location.reload()})}
</script></body></html>
